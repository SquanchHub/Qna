[pytest]
asyncio_mode = auto
log_cli = true
log_cli_level = INFO
markers =
    rag_m1: needs RAG milestone M1 (Compose services, /api/rag/health)
    rag_m2: needs RAG milestone M2 (migration 002, AI system user, ai_status)
    rag_m4: needs RAG milestone M4 (profile, resource and job APIs)
    rag_m5: needs RAG milestone M5 (compare, answer job)
    gitlab: needs GITLAB_TOKEN on the backend (/api/rag/health gitlab_token_configured)
    live_board: needs RAG_LIVE_ENABLED=true on the backend
    live_off: needs RAG_LIVE_ENABLED=false on the backend
    db_access: needs MySQL on localhost:3306 and Chroma on localhost:8001 (dev stack only)
    eval_corpus: slow eval/sample_data smoke test; runs only with RAG_EVAL_CORPUS=1
