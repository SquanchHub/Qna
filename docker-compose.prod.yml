# Production stack for the GCP VM. Runs the immutable images built and pushed
# by CI; the deploy job exports CI_REGISTRY_IMAGE and IMAGE_TAG. Secrets come
# from the .env file next to this file on the VM.
services:
  nginx:
    image: ${CI_REGISTRY_IMAGE}/nginx:${IMAGE_TAG}
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - qna_network

  backend:
    image: ${CI_REGISTRY_IMAGE}/backend:${IMAGE_TAG}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - APP_ENV=production
      # The RAG services on the compose network; set here so the VM .env
      # cannot point the backend elsewhere
      - OLLAMA_URL=http://ollama:11434
      - INFINITY_URL=http://infinity:7997
      - CHROMA_HOST=chroma
      - CHROMA_PORT=8000
    volumes:
      # Uploaded resources survive a redeploy, as in dev
      - uploads_data:/data/uploads
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      # service_started, not healthy: a cold Infinity can take 15 minutes, and
      # GET /api/rag/health reports each service's state meanwhile
      ollama:
        condition: service_started
      infinity:
        condition: service_started
      chroma:
        condition: service_started
    networks:
      - qna_network
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"

  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: qna
      MYSQL_USER: app_user
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - qna_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "app_user", "-p${MYSQL_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 45s

  redis:
    image: redis:7.0-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks:
      - qna_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    command: redis-server --appendonly yes --appendfsync everysec --maxmemory 512mb --maxmemory-policy allkeys-lru

  # --- RAG services (design-rag.md §4.3.1), same pins as docker-compose.yml.
  # No published ports: only the backend reaches them, over qna_network.
  # Model containers get explicit environment: entries, never env_file, so
  # MySQL and GitLab secrets stay out of them. mem_limit per design §4.3.3
  # (16 GB VM).

  ollama:
    image: ollama/ollama:0.35.1
    restart: unless-stopped
    mem_limit: 4g
    environment:
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_KEEP_ALIVE: 10m
    volumes:
      - ollama_models:/root/.ollama
    networks:
      - qna_network
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 12

  infinity:
    image: michaelf34/infinity:0.0.77-cpu
    platform: linux/amd64
    command: ["v2"]
    restart: unless-stopped
    mem_limit: 9g
    environment:
      # Fixed, not read from .env: exactly the models the eval profiles use
      # (MiniLM for sliding-window and type-tailored, gte-Qwen2 for
      # embedding-alt). bge-small is not served, so that preset 422s on create.
      # One INFINITY_BATCH_SIZE entry per model, both ';'-separated.
      INFINITY_MODEL_ID: "sentence-transformers/all-MiniLM-L6-v2;Alibaba-NLP/gte-Qwen2-1.5B-instruct;"
      INFINITY_BATCH_SIZE: "32;4;"
      INFINITY_ENGINE: torch
      INFINITY_DEVICE: cpu
      INFINITY_PORT: "7997"
    volumes:
      - infinity_cache:/app/.cache
    networks:
      - qna_network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:7997/health', timeout=5)"]
      interval: 15s
      timeout: 10s
      retries: 5
      # First start downloads every model (gte-Qwen2 is about 6 GB)
      start_period: 900s

  chroma:
    # Must equal chromadb-client in backend/requirements.txt
    image: chromadb/chroma:1.5.9
    restart: unless-stopped
    volumes:
      - chroma_data:/data
    networks:
      - qna_network
    healthcheck:
      # The image has bash but no curl, wget or python
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/8000; printf 'GET /api/v2/heartbeat HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3; head -1 <&3 | grep -q 200"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mysql_data:
  redis_data:
  ollama_models:
  infinity_cache:
  chroma_data:
  uploads_data:

networks:
  qna_network:
    driver: bridge
